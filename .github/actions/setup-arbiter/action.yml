name: setup-arbiter
description: Install arbiter[dev] into $RUNNER_TEMP/arbiter-venv (pip cache on).

inputs:
  python-version:
    description: CPython version
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install arbiter[dev] into venv
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/arbiter-venv"
        "$RUNNER_TEMP/arbiter-venv/bin/pip" install -U pip
        "$RUNNER_TEMP/arbiter-venv/bin/pip" install ".[dev]"
