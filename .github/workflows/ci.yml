name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTEST_ADDOPTS: "-q --tb=short"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Graph: boundaries + domain-gate + unit start together.
# Integration waits only on hexagon (not the unit matrix).
# Coverage and L3 wait on unit.

jobs:
  boundaries:
    name: hexagon boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce domain/application import rules
        run: python scripts/check_hexagon_boundaries.py

  domain-gate:
    name: domain gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            domain:
              - 'arbiter/domain/**'
              - 'scripts/check_hexagon_boundaries.py'
              - 'scripts/check_domain_coverage.py'

      - uses: ./.github/actions/setup-arbiter
        with:
          python-version: "3.12"

      - name: Choose domain coverage threshold
        id: thr
        run: |
          if [[ "${{ steps.filter.outputs.domain }}" == "true" ]]; then
            echo "fail_under=90" >> "$GITHUB_OUTPUT"
            echo "Domain paths changed → strict fail-under=90"
          else
            echo "fail_under=85" >> "$GITHUB_OUTPUT"
            echo "No domain path changes → fail-under=85"
          fi

      - name: Domain coverage from unit suite
        run: |
          STAGE="$(scripts/ci_stage.sh "$RUNNER_TEMP/arbiter-domain")"
          cd "$STAGE"
          "$RUNNER_TEMP/arbiter-venv/bin/pytest" tests \
            -m "not integration" \
            --cov=arbiter.domain \
            --cov-report=term-missing \
            --cov-report=json:coverage-domain.json
          "$RUNNER_TEMP/arbiter-venv/bin/python" scripts/check_domain_coverage.py \
            --coverage-json coverage-domain.json \
            --fail-under "${{ steps.thr.outputs.fail_under }}"

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-arbiter
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests (installed package)
        run: |
          STAGE="$(scripts/ci_stage.sh "$RUNNER_TEMP/arbiter-tests")"
          cd "$STAGE"
          "$RUNNER_TEMP/arbiter-venv/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util
          from pathlib import Path
          origin = Path(importlib.util.find_spec("arbiter").origin).resolve()
          assert "site-packages" in origin.parts, origin
          from arbiter.adapters.inbound.mcp_server import package_name, package_version
          assert package_name() == "arbiter"
          assert package_version() == importlib.metadata.version("arbiter")
          PY
          "$RUNNER_TEMP/arbiter-venv/bin/pytest" tests -m "not integration"

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [boundaries, unit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-arbiter
        with:
          python-version: "3.12"
      - name: Full suite coverage (installed package)
        run: |
          STAGE="$(scripts/ci_stage.sh "$RUNNER_TEMP/arbiter-cov")"
          cd "$STAGE"
          "$RUNNER_TEMP/arbiter-venv/bin/pytest" tests \
            --cov=arbiter \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json \
            --cov-fail-under=80
          "$RUNNER_TEMP/arbiter-venv/bin/python" scripts/check_domain_coverage.py \
            --coverage-json coverage.json \
            --fail-under 85

  integration:
    name: integration (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [boundaries]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-arbiter
        with:
          python-version: ${{ matrix.python-version }}

      - name: Integration tests (installed package)
        run: |
          STAGE="$(scripts/ci_stage.sh "$RUNNER_TEMP/arbiter-tests")"
          cd "$STAGE"
          "$RUNNER_TEMP/arbiter-venv/bin/pytest" tests -m integration

  commit-gate:
    name: layer-3 commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [boundaries, unit]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip when no ledger
        if: hashFiles('decisions/ledger.jsonl') == ''
        run: echo "No decisions/ledger.jsonl — verify-commit skipped (unit covers check_coverage)."

      - uses: ./.github/actions/setup-arbiter
        if: hashFiles('decisions/ledger.jsonl') != ''
        with:
          python-version: "3.12"

      - name: verify-commit against range
        if: hashFiles('decisions/ledger.jsonl') != ''
        env:
          ARBITER_DATA_DIR: ${{ github.workspace }}/decisions
          ARBITER_RULES_PATH: ${{ github.workspace }}/arbiter.rules.yaml.example
          ARBITER_ALLOW_BREAK_GLASS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-break-glass') && '1' || '0' }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git fetch origin main 2>/dev/null || true
          MSG="$(git log -1 --format=%B)"
          "$RUNNER_TEMP/arbiter-venv/bin/arbiter" verify-commit \
            --paths-from range \
            --base "$BASE" \
            --message "$MSG" \
            --json
