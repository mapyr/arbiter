# Podman lab: Hangar + Arbiter on a private compose network.
#
#   ./deploy/podman/up.sh
#   podman compose -f deploy/podman/compose.yaml down
#
# Arbiter HTTP MCP is a *static* Hangar remote (X-Arbiter-Secret).
# Do not publish arbiter's port.

name: arbiter

services:
  arbiter:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.arbiter
    image: localhost/arbiter:0.7.2
    environment:
      ARBITER_DATA_DIR: /data/decisions
      ARBITER_RULES_PATH: /config/arbiter.rules.yaml
      ARBITER_VOTERS_PATH: /config/arbiter.voters.yaml
      ARBITER_HTTP_MCP_PATH: /
      ARBITER_HTTP_SECRET: ${ARBITER_HTTP_SECRET}
      ARBITER_VOTER_1_KEY: ${ARBITER_VOTER_1_KEY:-}
      ARBITER_VOTER_2_KEY: ${ARBITER_VOTER_2_KEY:-${ARBITER_VOTER_1_KEY:-}}
      ARBITER_VOTER_3_KEY: ${ARBITER_VOTER_3_KEY:-${ARBITER_VOTER_1_KEY:-}}
    volumes:
      - ${ARBITER_LEDGER_DIR}:/data/decisions
      - ./config:/config:ro
    # Hangar image runs as uid 1000; share it so the ledger bind is writable
    # by both processes (container root creates 0644 files hangar cannot append).
    user: "1000:1000"
    networks:
      - mcp-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  hangar:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.hangar
    image: localhost/arbiter-hangar:2.6.0
    depends_on:
      arbiter:
        condition: service_healthy
    ports:
      - "${HANGAR_HOST_PORT:-18782}:8080"
    environment:
      MCP_CONFIG: /app/config.yaml
      MCP_MODE: http
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
      ARBITER_HANGAR_PRINCIPAL_ID: service:arbiter
      ARBITER_HANGAR_RESOLVE_TOKEN: ${ARBITER_HANGAR_RESOLVE_TOKEN:-}
      ARBITER_HTTP_SECRET: ${ARBITER_HTTP_SECRET}
      ARBITER_VOTER_1_KEY: ${ARBITER_VOTER_1_KEY:-}
      ARBITER_VOTER_2_KEY: ${ARBITER_VOTER_2_KEY:-${ARBITER_VOTER_1_KEY:-}}
      ARBITER_VOTER_3_KEY: ${ARBITER_VOTER_3_KEY:-${ARBITER_VOTER_1_KEY:-}}
    volumes:
      - ./config/hangar.config.yaml:/app/config.yaml:ro
      - ./config:/config:ro
      - hangar-data:/app/data
      - ${ARBITER_LEDGER_DIR}:/data/decisions
    networks:
      - mcp-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  mcp-net:
    driver: bridge

volumes:
  hangar-data:
    name: arbiter_hangar-data
    external: true
