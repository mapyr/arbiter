# Hangar in Podman — arbiter MCP is a static remote (shared secret).
# mockfs / mockhttp stay static so approval_list / hold channel can be declared.
logging:
  level: INFO
  json_format: false

persistence:
  backend: sqlite
  sqlite:
    data_dir: /app/data

auth:
  enabled: true
  allow_anonymous: false
  api_key:
    enabled: true
    header_name: X-API-Key

tool_access:
  mode: egress

discovery:
  enabled: false

approvals:
  enabled: true
  channel: arbiter
  arbiter:
    data_dir: /data/decisions
    intercept_rules_path: /config/arbiter.intercept.yaml
    voters_path: /config/arbiter.voters.yaml
    rules_path: /config/arbiter.rules.yaml
    # Resolve against this Hangar process (loopback inside the container).
    resolve_base_url: http://127.0.0.1:8080/api
    resolve_token_env: ARBITER_HANGAR_RESOLVE_TOKEN
    principal_id_env: ARBITER_HANGAR_PRINCIPAL_ID
    hold_margin_seconds: 10
    min_round_seconds: 20

mcp_servers:
  mockfs:
    mode: subprocess
    command:
      - python
      - /app/mockfs_server.py
    idle_ttl_s: 300
    tools:
      approval_list:
        - "*"
      approval_timeout_seconds: 900
      approval_channel: arbiter

  mockhttp:
    mode: subprocess
    command:
      - python
      - /app/mockhttp_server.py
    idle_ttl_s: 300
    tools:
      approval_list:
        - "*"
      approval_timeout_seconds: 900
      approval_channel: arbiter

  arbiter:
    mode: remote
    endpoint: "http://arbiter:8765/"
    description: "Arbiter decision gateway"
    auth:
      type: api_key
      api_key: ${ARBITER_HTTP_SECRET}
      api_key_header: X-Arbiter-Secret
    tools:
      deny_list:
        - resolve_decision
