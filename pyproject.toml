[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.7.1"
description = "Deterministic MCP decision gateway with an append-only ledger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "decision", "quorum", "governance", "hangar", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp==2.0.0",
    "httpx2>=2.10",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/mapyr/arbiter"
Documentation = "https://github.com/mapyr/arbiter/tree/main/docs"
Repository = "https://github.com/mapyr/arbiter"
Issues = "https://github.com/mapyr/arbiter/issues"
"Security Policy" = "https://github.com/mapyr/arbiter/blob/main/SECURITY.md"

[project.optional-dependencies]
hangar = [
    "mcp-hangar==2.6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mcp-hangar==2.6.0",
]

[project.scripts]
arbiter = "arbiter.adapters.inbound.cli:main"

[project.entry-points."mcp_hangar.approvals.delivery"]
arbiter = "arbiter.adapters.hangar.delivery:create_delivery"

[tool.setuptools.packages.find]
include = ["arbiter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: MCP/HTTP/stub-provider integration tests (slower)",
]

[tool.coverage.run]
branch = false
source = ["arbiter"]
omit = [
    "arbiter/adapters/inbound/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise TypeError",
]
